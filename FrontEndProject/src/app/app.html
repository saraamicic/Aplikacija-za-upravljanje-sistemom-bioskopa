<mat-sidenav-container class="example-container">
  <mat-sidenav mode="over" [fixedInViewport]="true" opened mode="side">
    <mat-accordion>
      <a mat-button routerLink=""  style="text-align: center">
        <mat-icon>home</mat-icon>
      </a>
      <mat-expansion-panel>
        <mat-expansion-panel-header>
          <mat-panel-title> Aplikacija </mat-panel-title>
          <mat-panel-description>
            Aplikacija za upravljanje radom bioskopa
          </mat-panel-description>
        </mat-expansion-panel-header>
        <mat-nav-list>
          <a mat-raised-button routerLink="/bioskop" style="background-color: rgb(246, 242, 255)">Bioskop</a>
        </mat-nav-list>
        <mat-nav-list>
          <a mat-raised-button routerLink="/film" style="background-color: rgb(246, 242, 255)">Film</a>
        </mat-nav-list>
        <mat-nav-list>
          <a mat-raised-button routerLink="/sala" style="background-color: rgb(246, 242, 255)">Sala</a>
        </mat-nav-list>
      </mat-expansion-panel>
      <mat-expansion-panel>
        <mat-expansion-panel-header>
          <mat-panel-title style="text-align: left"
            >Informacije</mat-panel-title
          >
          <mat-panel-description>
            Osnovne informacije o aplikaciji
          </mat-panel-description>
        </mat-expansion-panel-header>
        <mat-nav-list>
          <a mat-button routerLink="/about" >O nama</a>
        </mat-nav-list>
        <mat-nav-list>
          <a mat-button routerLink="/author" >Autor</a>
        </mat-nav-list>
        <mat-nav-list>
          <a mat-button routerLink="" >Pocetna</a>
        </mat-nav-list>
      </mat-expansion-panel>
    </mat-accordion>
  </mat-sidenav>
  <router-outlet></router-outlet>
</mat-sidenav-container>
