<mat-toolbar color="primary">
  <span class="title-center">Rezervacija</span>
</mat-toolbar>

<div class="container mat-elavation-z8">
  <table mat-table [dataSource]="dataSource" class="mat-cell">

    <!-- ID -->
    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef>ID</th>
      <td mat-cell *matCellDef="let row">{{ row.id }}</td>
    </ng-container>

    <!-- Broj osoba -->
    <ng-container matColumnDef="brojOsoba">
      <th mat-header-cell *matHeaderCellDef>Broj osoba</th>
      <td mat-cell *matCellDef="let row">{{ row.brojOsoba }}</td>
    </ng-container>

        <!-- Cena karte -->
    <ng-container matColumnDef="cenaKarte">
      <th mat-header-cell *matHeaderCellDef>Cena karte</th>
      <td mat-cell *matCellDef="let row">{{ row.cenaKarte }}</td>
    </ng-container>

        <!-- Datum -->
    <ng-container matColumnDef="datum">
      <th mat-header-cell *matHeaderCellDef>Datum</th>
      <td mat-cell *matCellDef="let row">{{ row.datum | date:'dd.MM.yyyy' }}</td>
    </ng-container>

        <!-- Placeno -->
    <ng-container matColumnDef="placeno">
      <th mat-header-cell *matHeaderCellDef>Placeno</th>
      <td mat-cell *matCellDef="let row">{{ row.placeno }}</td>
    </ng-container>

        <!--Sala-->
    <ng-container matColumnDef="sala">
      <th mat-header-cell *matHeaderCellDef>Sala</th>
      <td mat-cell *matCellDef="let row">{{ row.sala?.id }}</td>
    </ng-container>

        <!--Film-->
    <ng-container matColumnDef="film">
      <th mat-header-cell *matHeaderCellDef>Film</th>
      <td mat-cell *matCellDef="let row">{{ row.film?.naziv}}</td>
    </ng-container>

    <!-- Action Buttons -->
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>
        <button mat-icon-button (click)="openDialog(1)">
          <mat-icon color="accent">add</mat-icon>
        </button>
      </th>
      <td mat-cell *matCellDef="let row; let i = index">
        <button mat-icon-button (click)="openDialog(2, row.id, row.naziv, row.zanr, row.trajanje, row.recenzija)">
          <mat-icon color="primary" aria-label="Edit">edit</mat-icon>
        </button>
        <button mat-icon-button (click)="openDialog(3, row.id, row.naziv, row.zanr, row.trajanje, row.recenzija)">
          <mat-icon color="warn" aria-label="Delete">delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <!-- Rows -->
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
</div>
