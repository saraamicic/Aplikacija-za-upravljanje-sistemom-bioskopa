<mat-toolbar color="primary">
  <span class="title-center">Film</span>
</mat-toolbar>

<div class="container mat-elavation-z8">
  <table mat-table matSort [dataSource]="dataSource" class="mat-cell">
    <!--broj ng containtera zavisi od broja obelezja u klasi-->
    <!-- ID -->
    <ng-container matColumnDef="id">
      <th mat-header-cell mat-sort-header *matHeaderCellDef>ID</th>
      <td mat-cell *matCellDef="let row">{{ row.id }}</td>
    </ng-container>

    <!-- Naziv -->
    <ng-container matColumnDef="naziv">
      <th mat-header-cell mat-sort-header *matHeaderCellDef>Naziv</th>
      <td mat-cell *matCellDef="let row">{{ row.naziv }}</td>
    </ng-container>

        <!-- Zanr -->
    <ng-container matColumnDef="zanr">
      <th mat-header-cell mat-sort-header *matHeaderCellDef>Zanr</th>
      <td mat-cell *matCellDef="let row">{{ row.zanr }}</td>
    </ng-container>

            <!-- Trajanje -->
    <ng-container matColumnDef="trajanje">
      <th mat-header-cell mat-sort-header *matHeaderCellDef>Trajanje</th>
      <td mat-cell *matCellDef="let row">{{ row.trajanje }}</td>
    </ng-container>

            <!-- Recenzija -->
    <ng-container matColumnDef="recenzija">
      <th mat-header-cell mat-sort-header *matHeaderCellDef>Recenzija</th>
      <td mat-cell *matCellDef="let row">{{ row.recenzija }}</td>
    </ng-container>

    <!-- Action Buttons -->
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>
        <button mat-icon-button (click)="openDialog(1)">
          <mat-icon color="accent">add</mat-icon>
        </button>
      </th>
      <td mat-cell *matCellDef="let row; let i = index">
        <button mat-icon-button (click)="openDialog(2, row.id, row.naziv, row.zanr, row.trajanje, row.recenzija)">
          <mat-icon color="primary" aria-label="Edit">edit</mat-icon>
        </button>
        <button mat-icon-button (click)="openDialog(3, row.id, row.naziv, row.zanr, row.trajanje, row.recenzija)">
          <mat-icon color="warn" aria-label="Delete">delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <!-- Rows -->
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
  <mat-paginator [pageSizeOptions]="[5,10,20]" showFirstLastButtons>
  </mat-paginator>
</div>
