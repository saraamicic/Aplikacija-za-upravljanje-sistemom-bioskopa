<mat-toolbar color="primary">
  <span class="title-center">Sala</span>
</mat-toolbar>

<div class="container mat-elavation-z8">
  <table mat-table [dataSource]="dataSource" class="mat-cell">

    <!-- ID -->
    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef>ID</th>
      <td mat-cell *matCellDef="let row">{{ row.id }}</td>
    </ng-container>

    <!-- Kapacitet -->
    <ng-container matColumnDef="kapacitet">
      <th mat-header-cell *matHeaderCellDef>Kapacitet</th>
      <td mat-cell *matCellDef="let row">{{ row.kapacitet }}</td>
    </ng-container>

        <!-- Broj redova -->
    <ng-container matColumnDef="brojRedova">
      <th mat-header-cell *matHeaderCellDef>Broj redova</th>
      <td mat-cell *matCellDef="let row">{{ row.brojRedova }}</td>
    </ng-container>

        <!-- Bioskop -->
    <ng-container matColumnDef="bioskop">
      <th mat-header-cell *matHeaderCellDef>Bioskop</th>
      <td mat-cell *matCellDef="let row">{{ row.bioskop?.naziv }}</td> 
    </ng-container> 

    <!-- Action Buttons -->
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>
        <button mat-icon-button (click)="openDialog(1)">
          <mat-icon color="accent">add</mat-icon>
        </button>
      </th>
      <td mat-cell *matCellDef="let row; let i = index">
        <button mat-icon-button (click)="openDialog(2, row.id, row.kapacitet, row.brojRedova, row.bioskop.id)">
          <mat-icon color="primary" aria-label="Edit">edit</mat-icon>
        </button>
        <button mat-icon-button (click)="openDialog(3, row.id, row.kapacitet, row.brojRedova, row.bioskop.id)">
          <mat-icon color="warn" aria-label="Delete">delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <!-- Rows -->
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns" (click)="selectRow(row)"> </tr>
  </table>
</div>
